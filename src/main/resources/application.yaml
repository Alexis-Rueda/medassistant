spring:
  server:
    port: 8090
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.chroma.autoconfigure.ChromaVectorStoreAutoConfiguration
  application:
    name: medassistant
  datasource:
    url: jdbc:postgresql://localhost:5434/medassistant
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: create-drop
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8099/realms/medassistant
  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    vectorstore:
      chroma:
        url: http://localhost:8098
#        Usar lo siguiene cuando solo es un vectorstore
#        collection-name: medassistant
#        initialize-schema: true
    mcp:
      client:
        request-timeout: 60s
        stdio:
          connections:
            filesystem:
              command: C:\Program Files\nodejs\node.exe
              args:
                - 'C:\Program Files\nodejs\node_modules\@modelcontextprotocol\server-filesystem\dist\index.js'
                - 'C:\Users\PC\Desktop\Cursos\spring-boot-apps\medassistant\src\main\resources\prompts'
            github:
              command: C:\Program Files\nodejs\node.exe
              args:
                - 'C:\Program Files\nodejs\node_modules\@modelcontextprotocol\server-github\dist\index.js'
              env:
                GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_TOKEN}
